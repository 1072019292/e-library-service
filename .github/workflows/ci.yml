name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            database: h2
            arguments: ''
          - os: ubuntu-latest
            database: postgres
            arguments: '-Ppostgres-test'
          - os: windows-latest
            database: h2
            arguments: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress ${{ matrix.arguments }} verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test frontend request behavior
        run: node --test src/test/frontend/api.test.mjs
      - name: Test Pages gateway forwarding and error behavior
        run: node --test cloud/pages-gateway/gateway.test.mjs
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}-${{ matrix.database }}
          path: |
            target/surefire-reports/
            target/postgres-test-reports/
          if-no-files-found: ignore
