services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: elibrary
      POSTGRES_USER: elibrary
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell or .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elibrary -d elibrary"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://db:5432/elibrary
      DB_USERNAME: elibrary
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your shell or .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 20s
volumes:
  postgres-data:
